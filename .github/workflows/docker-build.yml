name: Build and Deploy MyCRUD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout latest code
        uses: actions/checkout@v4

      - name: Rebuild and restart Docker application
        shell: powershell
        run: docker compose up -d --build

      - name: Check Docker containers
        shell: powershell
        run: docker compose ps