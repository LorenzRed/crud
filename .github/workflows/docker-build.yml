name: Build and Deploy MyCRUD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout latest code
        uses: actions/checkout@v4

      - name: Deploy to the existing Docker Compose project
        shell: powershell
        run: |
          $projectPath = "C:\Users\balle\OneDrive\Documents\mycrud"

          Set-Location $projectPath

          git pull origin main

          docker compose up -d --build

      - name: Verify deployment
        shell: powershell
        run: |
          Set-Location "C:\Users\balle\OneDrive\Documents\mycrud"

          docker compose ps
          docker image ls